<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apexwin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Apexwin</h1>
        <p>Your sports website</p>
    </header>

    <main>
        <section class="hero">
            <h2>Welcome to Apexwin</h2>
            <p>Follow your favourite sports and matches.</p>
            <button onclick="showMessage()">Get Started</button>
        </section>

        <section class="matches">
            <h2>Today's Matches</h2>

            <div class="match">
                <span>Team A</span>
                <strong>VS</strong>
                <span>Team B</span>
            </div>

            <div class="match">
                <span>Team C</span>
                <strong>VS</strong>
                <span>Team D</span>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Apexwin</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
